
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="leafGradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="leafGradRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14.08" fill="url(#bgGrad)"/>

  <!-- Subtle golden border on standard icons -->
  <rect x="1.28" y="1.28" width="61.44" height="61.44" rx="12.8" fill="none" stroke="#22c55e" stroke-opacity="0.35" stroke-width="0.96"/>

  <g transform="translate(32, 32)">
    <!-- Inner soft backdrop circle -->
    <circle r="21.401600000000002" fill="#0f3d23" fill-opacity="0.5"/>
    
    <!-- Soil Mound / Foundation Pot base -->
    <ellipse cx="0" cy="13.619200000000001" rx="15.5648" ry="4.3776" fill="url(#soilGrad)" opacity="0.95"/>
    <ellipse cx="0" cy="13.619200000000001" rx="12.6464" ry="2.6752000000000002" fill="#451a03" opacity="0.5"/>

    <!-- Seedling Stem -->
    <path d="M 0,13.132800000000001 C -1.9456,3.8912 -0.9728,-3.8912 0,-8.7552" 
          stroke="url(#stemGrad)" stroke-width="2.6752000000000002" stroke-linecap="round" fill="none"/>

    <!-- Left Leaf (Flourishing Seedling) -->
    <path d="M -0.7296,1.9456 
             C -10.700800000000001,1.9456 -16.5376,-7.295999999999999 -15.5648,-12.6464
             C -7.7824,-13.619200000000001 -0.9728,-6.8096000000000005 -0.4864,-0.9728 Z"
          fill="url(#leafGradLeft)" filter="url(#softGlow)"/>
    
    <!-- Leaf Spine Left -->
    <path d="M -0.7296,1.9456 C -6.8096000000000005,-3.8912 -12.6464,-8.7552 -15.5648,-12.6464"
          stroke="#86efac" stroke-width="0.7296" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Right Leaf (Sunlit Leaf) -->
    <path d="M 0,-2.9184 
             C 9.728000000000002,-3.8912 15.5648,-12.6464 13.619200000000001,-18.4832
             C 5.8368,-17.9968 0,-10.700800000000001 0,-2.9184 Z"
          fill="url(#leafGradRight)"/>

    <!-- Leaf Spine Right -->
    <path d="M 0,-2.9184 C 5.8368,-8.7552 9.728000000000002,-13.619200000000001 13.619200000000001,-18.4832"
          stroke="#bbf7d0" stroke-width="0.7296" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Small emerging top shoot sprout -->
    <path d="M 0,-8.7552 C 1.9456,-13.619200000000001 0.9728,-17.5104 0,-20.4288 C -1.4592,-17.023999999999997 -0.9728,-12.16 0,-8.7552 Z"
          fill="#86efac"/>
  </g>
</svg>
